name: Build SuperMarket Fawry APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found in repository."
            exit 1
          fi

          echo "Using project: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Android Gradle configuration
        shell: bash
        run: |
          set -e

          echo "Checking app/build.gradle"
          sed -n '1,100p' "$PROJECT_DIR/app/build.gradle"

          echo "Checking settings.gradle"
          sed -n '1,120p' "$PROJECT_DIR/settings.gradle"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-Fawry-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
